[project]
name = "chatgpt-endnote-mcp"
version = "1.4.5"
description = "Local read-only EndNote MCP server for Codex desktop"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
readme = "README.md"
authors = [
    { name = "Gokhan Gokmen" },
]
keywords = [
    "endnote", "mcp", "codex", "references", "citation",
    "academic", "research", "literature", "pdf", "bibliography",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing :: General",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "mcp[cli]>=1.12,<2",
    "lxml>=5.0",
    "PyMuPDF>=1.24",
    "pyyaml>=6.0",
    "click>=8.0",
    "rich>=13.0",
]

[project.optional-dependencies]
semantic = ["sentence-transformers>=2.2.0", "sqlite-vec>=0.1.0"]
dev = ["hatchling>=1.26", "pytest>=8.0", "numpy>=1.26", "tomli>=2; python_version < '3.11'"]

[project.urls]
Homepage = "https://github.com/bjreisman/chatgpt-endnote-mcp"
Documentation = "https://github.com/bjreisman/chatgpt-endnote-mcp#readme"
Repository = "https://github.com/bjreisman/chatgpt-endnote-mcp"
Issues = "https://github.com/bjreisman/chatgpt-endnote-mcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
chatgpt-endnote-mcp = "endnote_mcp.desktop_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/endnote_mcp"]

[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "scripts", "examples", "skills", "docs", "README.md", "LICENSE", "CITATION.cff", "pyproject.toml", ".mcp.json", ".codex-plugin", ".claude-plugin", ".github"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["archive", ".git", ".local", ".venv", "build", "dist", "*.egg"]

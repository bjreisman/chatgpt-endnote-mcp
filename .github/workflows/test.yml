name: Tests

on:
  workflow_dispatch:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }} --extra dev

      - name: Run tests
        run: uv run pytest tests/ -v

      - name: Build both plugin packages
        run: |
          uv run python -m hatchling build
          uv run python scripts/build_plugin.py
          uv run python scripts/build_plugin.py --platform windows

  windows-semantic:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv python install 3.12
      - run: uv sync --python 3.12 --extra dev --extra semantic
      - name: Real model, offline serving, and embedding refresh
        env:
          ENDNOTE_TEST_SEMANTIC: '1'
        run: uv run pytest tests/test_semantic_integration.py -v
